<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPAIO Pi Payment Test</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .instruction { margin-top: 20px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="loading-area">
        <p>파이 네트워크 연결 중...</p>
    </div>

    <div id="auth-area" style="display: block;">
        <p><strong><span id="username">방문자</span></strong> 리더님, 환영합니다!</p>
        <button style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 10px;">
            ✅ 사이트 로드 완료
        </button>
        
        <div style="margin-top: 20px;">
            <button onclick="onTestPayment()" style="background-color: #6200ee; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1em; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                💳 테스트 결제 (0.1 Pi)
            </button>
        </div>

        <div class="instruction">
            파이 브라우저(샌드박스)에서 위 버튼을 눌러 결제창이 뜨는지 확인해 주세요.<br />
            성공하면 10단계 체크리스트가 완료됩니다.
        </div>
    </div>

    <div id="error-area" style="display: none; color: red;"></div>

    <script>
        const Pi = window.Pi;

        async function initPi() {
            try {
                // SDK 초기화 (샌드박스 모드)
                await Pi.init({ version: "2.0", sandbox: true });
                
                // 사용자 인증
                const auth = await Pi.authenticate(["username"], (payment) => {
                    console.log("결제 승인 대기 중...", payment);
                });

                document.getElementById("loading-area").style.display = "none";
                document.getElementById("username").innerText = auth.user.username;
            } catch (err) {
                console.error(err);
                document.getElementById("loading-area").style.display = "none";
                // 일반 브라우저에서는 경고만 띄우고 버튼은 유지함
                console.log("파이 브라우저 외부 접속 중");
            }
        }

        // 결제창 호출 함수
        function onTestPayment() {
            try {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "XPAIO 테스트넷 결제",
                    metadata: { orderId: "XPAIO_ORDER_001" },
                }, {
                    onReadyForServerApproval: (paymentId) => { console.log("서버 승인 대기:", paymentId); },
                    onReadyForServerCompletion: (paymentId, txid) => { alert("결제 완료! TXID: " + txid); },
                    onCancel: (paymentId) => { console.log("결제 취소"); },
                    onError: (error, payment) => { 
                        alert("파이 브라우저가 아니거나 지갑 연결에 실패했습니다.");
                        console.error("에러 발생:", error); 
                    },
                });
            } catch (e) {
                alert("결제 기능을 실행할 수 없습니다. 파이 브라우저를 사용하세요.");
            }
        }

        window.onload = initPi;
    </script>
</body>
</html>
